[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalization"
version = "1.1.0.dev0"
description = "Hierarchical layout and reading-order analysis for historical Chinese documents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Qinnan Zhou" }]
dependencies = [
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
archive = ["PyMuPDF>=1.24.0"]

[project.scripts]
digitalization-layout = "digitalization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["digitalization*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
