[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "digitalization"
version = "1.0.0"
description = "Layout detection and OCR preparation for vertical Traditional Chinese historical documents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Qinnan Zhou" }]
dependencies = [
    "paddlepaddle>=3.0.0",
    "paddleocr>=3.0.0",
    "PyMuPDF>=1.24.0",
    "opencv-python>=4.8.0",
    "Pillow>=10.0.0",
    "numpy>=2.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "tqdm>=4.66.0",
    "scipy>=1.11.0",
    "scikit-image>=0.22.0",
]

[project.scripts]
vertical-ocr = "cli:cli"

[tool.setuptools]
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["src"]

